name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://placelink:placelink_local@localhost:54329/placelink?schema=public
  AUTH_SECRET: placelink-ci-auth-secret-must-be-at-least-32-characters
  ADMIN_USER_IDS: seed-user-jihoon
  LOG_LEVEL: info

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: placelink
          POSTGRES_USER: placelink
          POSTGRES_PASSWORD: placelink_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U placelink -d placelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Run verification gate
        run: pnpm verify

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: placelink
          POSTGRES_USER: placelink
          POSTGRES_PASSWORD: placelink_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U placelink -d placelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Install Playwright browser
        run: pnpm --filter @placelink/web exec playwright install --with-deps chromium

      - name: Run end-to-end gate
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
