services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: placelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: placelink
      POSTGRES_USER: placelink
      POSTGRES_PASSWORD: placelink_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placelink -d placelink"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - placelink-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  placelink-postgres-data:
